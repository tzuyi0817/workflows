name: Deploy to Vercel

on:
  workflow_call:
    secrets:
      VERCEL_TOKEN:
        required: true

      VERCEL_ORG_ID:
        required: true

      VERCEL_PROJECT_ID:
        required: true

    inputs:
      environment:
        type: string
        default: ''

      prod:
        type: boolean
        default: false

      create-comment:
        type: boolean
        default: false

jobs:
  deploy-vercel:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    outputs:
      deployment-url: ${{ steps.deploy.outputs.deployment-url }}

    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v3

      - name: Install Vercel CLI
        run: pnpm install --global vercel@latest

      - name: Pull Vercel environment information
        shell: bash
        run: |
          ENV=$(echo "${{ inputs.environment }}" | tr '[:upper:]' '[:lower:]')
          vercel pull --yes --environment="$ENV" --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Build project artifacts
        run: vercel build ${{ inputs.prod && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy project artifacts to Vercel
        id: deploy
        shell: bash
        run: |
          if [ "${{ inputs.create-comment }}" = "true" ]; then
            vercel deploy --prebuilt ${{ inputs.prod && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} > deploy.log
            echo "deployment-url=$(cat deploy.log)" >> $GITHUB_OUTPUT
          else
            vercel deploy --prebuilt ${{ inputs.prod && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
          fi

  create-comment:
    if: ${{ inputs.create-comment }}
    needs: deploy-vercel
    runs-on: ubuntu-latest

    permissions:
      issues: write
      pull-requests: write

    steps:
      - name: Comment URL to PR
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "Deployed at ${{ env.DEPLOYMENT_URL }}"
            })
        env:
          DEPLOYMENT_URL: ${{ needs.deploy-vercel.outputs.deployment-url }}
