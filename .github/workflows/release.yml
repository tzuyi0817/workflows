name: Release

on:
  workflow_call:
    inputs:
      github-release:
        type: boolean
        default: true

      publish:
        type: boolean
        default: false

      build:
        type: string
        default: ''

      tag:
        type: string
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup environment
        uses: tzuyi0817/workflows/setup-environment@v1
        with:
          fetch-depth: true

      - name: Generate github changelog
        run: pnpm dlx changelogithub
        continue-on-error: true
        if: ${{ inputs.github-release }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: ${{ inputs.build }}
        if: ${{ inputs.build && inputs.publish }}

      - name: Publish to npm
        run: pnpm -r publish --access public --no-git-checks ${{ env.TAG_ARG }}
        if: ${{ inputs.publish }}
        env:
          TAG_ARG: ${{ inputs.tag && format('--tag {0}', inputs.tag) || '' }}
