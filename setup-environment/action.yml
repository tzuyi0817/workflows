name: Setup Environment

description: Setup environment and install dependencies.

inputs:
  fetch-depth:
    description: The fetch depth for actions/checkout to fetch all history for all branches and tags.
    type: boolean
    default: false

  node-version:
    description: Version Spec of the version to use.
    type: string
    default: 'lts/*'

  auto-install:
    description: Whether to automatically install dependencies.
    type: boolean
    default: true

  package-manager:
    description: 'Package manager to use. Examples: npm, yarn, pnpm.'
    type: string
    default: pnpm

  no-frozen-lockfile:
    description: Whether to disable frozen lockfile installation.
    type: boolean
    default: false

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: "${{ inputs.fetch-depth && '0' || '1' }}"

    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        run_install: false
      if: ${{ inputs.package-manager == 'pnpm' }}

    - name: Setup node
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: ${{ inputs.package-manager }}
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      shell: bash
      run: ${{ inputs.package-manager }} install ${{ inputs.no-frozen-lockfile && '--no-frozen-lockfile' || '' }}
      if: ${{ inputs.auto-install }}
